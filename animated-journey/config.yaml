name: animated-journey Mesh
description: Passive RF scanning mesh for neighborhood device mapping
version: "0.5.2"
slug: animated-journey-mesh
url: https://github.com/austinkregel/animated-journey
arch:
  - aarch64
  - amd64
  - armv7
ingress: true
ingress_port: 8099
panel_icon: mdi:access-point-network
full_access: true
map:
  - config:rw
  - ssl:ro
  - share:rw
startup: application
homeassistant_api: true
auth_api: true
services:
  - mqtt:want
options:
  mqtt_topic_prefix: animated-journey
  scan_interval_ms: 2000
  position_update_ms: 1000
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_pass: ""
schema:
  mqtt_topic_prefix: str
  scan_interval_ms: int
  position_update_ms: int
  mqtt_host: str?
  mqtt_port: int?
  mqtt_user: str?
  mqtt_pass: password?
