<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>animated-journey · device dashboard</title>
  <style>
    :root {
      --bg: #0e1116; --panel: #161b22; --panel2: #1c232d; --border: #2b333d;
      --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
      --ok: #3fb950; --warn: #d29922; --bad: #f85149; --stale: #d29922;
      --update: #a371f7;
      --co: #767f8b;  /* coprocessor (C6) values: dimmer than host --fg */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    header {
      position: sticky; top: 0; z-index: 5; background: var(--panel);
      border-bottom: 1px solid var(--border); padding: 10px 16px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
    h1 .sub { color: var(--muted); font-weight: 400; }
    .stats { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; align-items: center; }
    .stat { display: flex; flex-direction: column; line-height: 1.2; }
    .stat b { font-size: 15px; }
    .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    .target { font-family: inherit; color: var(--accent); }
    .controls { display: flex; align-items: center; gap: 10px; }
    button {
      background: var(--panel2); color: var(--fg); border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit;
    }
    button:hover { border-color: var(--accent); }
    label.chk { color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; }
    .conn { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; flex: none; }
    .dot.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .dot.stale { background: var(--stale); }
    .dot.bad { background: var(--bad); }
    main { padding: 12px 16px 40px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 7px 10px; white-space: nowrap; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase;
         letter-spacing: .5px; position: sticky; top: 55px; background: var(--bg); z-index: 1; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    /* Value hierarchy: the P4 host's own values read as primary... */
    tbody td { font-size: 13.5px; font-weight: 600; }
    /* ...while coprocessor (C6) values are secondary: smaller and dimmer. */
    .co { font-size: 11px; font-weight: 400; color: var(--co); }
    tr.offline { opacity: .5; }
    tr:hover td { background: var(--panel); }
    .node-id { font-weight: 600; }
    .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid transparent; }
    .pill.cur { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
    .pill.upd { color: var(--update); border-color: color-mix(in srgb, var(--update) 45%, transparent); }
    .pill.unk { color: var(--muted); border-color: var(--border); }
    .git { color: var(--fg); }
    .git .dirty { color: var(--warn); }
    .temp.hot { color: var(--bad); }
    .temp.warm { color: var(--warn); }
    .muted { color: var(--muted); }
    .age.stale { color: var(--stale); }
    .age.bad { color: var(--bad); }
    .empty { color: var(--muted); padding: 40px; text-align: center; }
    footer { color: var(--muted); font-size: 11px; padding: 0 16px 24px; }

    /* Live message feed */
    #feed { border-top: 1px solid var(--border); margin-top: 8px; }
    .feed-bar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
      position: sticky; top: 55px; z-index: 2;
    }
    .feed-bar h2 { font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .feed-bar select, .feed-bar button { font: inherit; }
    .feed-bar .count { color: var(--muted); margin-left: auto; }
    #feed-log {
      font-size: 12px; padding: 6px 0; max-height: 45vh; overflow-y: auto; background: var(--bg);
    }
    .fr { display: flex; gap: 8px; padding: 2px 16px; white-space: nowrap; }
    .fr:hover { background: var(--panel); }
    .fr .t { color: var(--muted); flex: none; }
    .fr .k { flex: none; width: 52px; text-transform: uppercase; font-size: 10px; padding-top: 1px; }
    .fr .k.scan { color: var(--accent); }
    .fr .k.status { color: var(--ok); }
    .fr .k.cmd { color: var(--update); }
    .fr .k.other { color: var(--muted); }
    .fr .top { color: var(--fg); flex: none; }
    .fr .pl { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <header>
    <h1>animated-journey <span class="sub">· device dashboard</span></h1>
    <div class="conn"><span id="conn-dot" class="dot"></span><span id="conn-text">connecting…</span></div>
    <div class="stats">
      <div class="stat"><b id="s-online">–</b><span>online</span></div>
      <div class="stat"><b id="s-total">–</b><span>total</span></div>
      <div class="stat"><b id="s-updates">–</b><span>need update</span></div>
      <div class="stat"><b class="target" id="s-target">–</b><span>target build</span></div>
    </div>
    <div class="controls">
      <label class="chk"><input type="checkbox" id="auto" checked> auto</label>
      <button id="refresh">↻ refresh</button>
    </div>
  </header>
  <main>
    <table id="tbl">
      <thead>
        <tr>
          <th>node</th><th>chip</th><th>fw</th><th>build (git)</th><th>status</th>
          <th class="num">uptime</th><th class="num">temp</th><th class="num">heap (min)</th>
          <th class="num">psram</th><th class="num">rssi</th><th>reset</th><th>c6</th>
          <th class="num">ble/act</th><th class="num">beac</th><th class="num">probe</th>
          <th class="num">seen</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>No nodes have reported status yet. Waiting for MQTT…</div>
  </main>

  <section id="feed">
    <div class="feed-bar">
      <h2>live message feed</h2>
      <label class="chk">filter
        <select id="feed-filter">
          <option value="all">all</option>
          <option value="status">status</option>
          <option value="scan">scan</option>
          <option value="cmd">cmd</option>
          <option value="other">other</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="feed-run" checked> streaming</label>
      <button id="feed-clear">clear</button>
      <span class="count" id="feed-count">0 shown</span>
    </div>
    <div id="feed-log"></div>
  </section>

  <footer id="foot"></footer>

  <script>
    const API = "{{INGRESS_PATH}}/api/dev/nodes";
    let timer = null;

    const $ = (id) => document.getElementById(id);

    function fmtUptime(s) {
      if (s == null) return "–";
      s = Math.floor(s);
      const d = Math.floor(s / 86400); s %= 86400;
      const h = Math.floor(s / 3600); s %= 3600;
      const m = Math.floor(s / 60);
      if (d) return `${d}d${h}h`;
      if (h) return `${h}h${m}m`;
      if (m) return `${m}m`;
      return `${s}s`;
    }
    function fmtBytes(b) {
      if (b == null) return "–";
      if (b === 0) return "0";
      const k = b / 1024, m = b / 1048576;
      if (m >= 1) return m.toFixed(1) + "M";
      if (k >= 1) return k.toFixed(0) + "K";
      return b + "B";
    }
    function fmtAge(s) {
      if (s == null) return "–";
      s = Math.floor(s);
      if (s < 60) return s + "s";
      if (s < 3600) return Math.floor(s / 60) + "m";
      return Math.floor(s / 3600) + "h";
    }
    function esc(v) { return String(v == null ? "" : v).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

    function gitCell(n) {
      if (!n.fw_git) return '<span class="muted">unknown (pre-versioning)</span>';
      const base = esc(n.fw_git.replace(/-dirty$/, ""));
      const dirty = n.dirty ? ' <span class="dirty" title="built with uncommitted changes">-dirty</span>' : "";
      return `<span class="git">${base}${dirty}</span>`;
    }
    function statusCell(n) {
      if (!n.fw_git) return '<span class="pill unk">?</span>';
      if (n.up_to_date) return '<span class="pill cur">✓ current</span>';
      return '<span class="pill upd">⬆ update</span>';
    }
    function tempCell(n) {
      if (n.chip_temp == null) return '<span class="muted">–</span>';
      const t = n.chip_temp;
      const cls = t >= 75 ? "hot" : t >= 60 ? "warm" : "";
      return `<span class="temp ${cls}">${t.toFixed(1)}°</span>`;
    }
    function c6Cell(n) {
      // No C6 fields at all -> not a P4 (or pre-C6-diag firmware).
      if (!n.c6_fw && (n.c6_link === null || n.c6_link === undefined)) return '<span class="muted">–</span>';
      const link = n.c6_link ? "ok" : "bad";
      const reboots = n.c6_reboots || 0;
      const brownout = n.c6_reset_name === "brownout";
      const tip = `SDIO ${n.c6_link ? "up" : "down"} · chip ${n.c6_chip || "?"} · rpc ${n.c6_rpc || "?"} · `
                + `reset ${n.c6_reset_name || n.c6_reset || "?"} · reboots ${n.c6_reboots ?? "?"}`;
      // Inline coprocessor values (version, abnormal reset, reboot count).
      const bits = [n.c6_fw ? esc(n.c6_fw) : "?"];
      if (n.c6_reset_name && n.c6_reset_name !== "power-on") bits.push("rst:" + esc(n.c6_reset_name));
      if (reboots > 1) bits.push("×" + reboots);
      const warn = brownout ? ' <span style="color:var(--bad)" title="C6 brownout reset">⚠</span>' : "";
      return `<span class="dot ${link}" title="${esc(tip)}"></span> `
           + `<span class="co" title="${esc(tip)}">${bits.join(" · ")}</span>${warn}`;
    }

    function ageCell(n) {
      const cls = !n.online ? "bad" : (n.age_s != null && n.age_s > 35) ? "stale" : "";
      return `<span class="age ${cls}">${fmtAge(n.age_s)}</span>`;
    }
    function dotFor(n) {
      if (!n.online) return "bad";
      return (n.age_s != null && n.age_s > 35) ? "stale" : "ok";
    }

    function render(data) {
      const nodes = data.nodes || [];
      $("s-online").textContent = data.online_count ?? "–";
      $("s-total").textContent = data.node_count ?? "–";
      const needing = nodes.filter(n => n.fw_git && !n.up_to_date).length;
      $("s-updates").textContent = needing;
      $("s-target").textContent = data.target_git ? data.target_git.replace(/-dirty$/, "") + (data.target_git.endsWith("-dirty") ? "*" : "") : "–";
      $("s-target").title = data.target_git || "no git-versioned firmware seen yet";

      $("empty").hidden = nodes.length > 0;
      $("rows").innerHTML = nodes.map(n => `
        <tr class="${n.online ? "" : "offline"}">
          <td><span class="dot ${dotFor(n)}"></span> <span class="node-id">${esc(n.node_id)}</span></td>
          <td>${esc(n.chip_model) || '<span class="muted">–</span>'}</td>
          <td>${esc(n.fw_version) || '<span class="muted">–</span>'}</td>
          <td>${gitCell(n)}</td>
          <td>${statusCell(n)}</td>
          <td class="num">${fmtUptime(n.uptime)}</td>
          <td class="num">${tempCell(n)}</td>
          <td class="num">${fmtBytes(n.free_heap)} <span class="muted">(${fmtBytes(n.min_free_heap)})</span></td>
          <td class="num">${n.psram_total ? fmtBytes(n.psram_free) + "/" + fmtBytes(n.psram_total) : '<span class="muted">–</span>'}</td>
          <td class="num">${n.wifi_rssi ? n.wifi_rssi : '<span class="muted">–</span>'}</td>
          <td>${esc(n.reset_reason_name) || (n.reset_reason == null ? '<span class="muted">–</span>' : n.reset_reason)}</td>
          <td>${c6Cell(n)}</td>
          <td class="num">${n.ble ?? "–"}<span class="muted">/${n.ble_active ?? "–"}</span></td>
          <td class="num">${n.beacons ?? "–"}</td>
          <td class="num">${n.probes ?? "–"}</td>
          <td class="num">${ageCell(n)}</td>
        </tr>`).join("");

      $("foot").textContent = `updated ${new Date().toLocaleTimeString()} · stale after ${data.stale_timeout_s ?? "?"}s · target = newest firmware build seen (marked * if dirty)`;
    }

    async function poll() {
      try {
        const r = await fetch(API, { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const data = await r.json();
        $("conn-dot").className = "dot ok";
        $("conn-text").textContent = "connected";
        render(data);
      } catch (e) {
        $("conn-dot").className = "dot bad";
        $("conn-text").textContent = "error: " + e.message;
      }
    }

    function schedule() {
      if (timer) clearInterval(timer);
      if ($("auto").checked) timer = setInterval(poll, 2000);
    }
    $("refresh").onclick = poll;
    $("auto").onchange = schedule;
    poll();
    schedule();

    // ---- Live message feed ----
    const FEED_API = "{{INGRESS_PATH}}/api/dev/feed";
    const FEED_MAX_ROWS = 500;   // cap DOM rows
    let feedCursor = -1;
    let feedTimer = null;

    function fmtClock(ts) {
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString(undefined, { hour12: false }) +
             "." + String(d.getMilliseconds()).padStart(3, "0");
    }

    function appendFeed(entries) {
      const log = $("feed-log");
      const filter = $("feed-filter").value;
      // Only autoscroll if the user is already near the bottom.
      const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
      const frag = document.createDocumentFragment();
      let added = 0;
      for (const e of entries) {
        if (filter !== "all" && e.kind !== filter) continue;
        const row = document.createElement("div");
        row.className = "fr";
        row.innerHTML =
          `<span class="t">${fmtClock(e.ts)}</span>` +
          `<span class="k ${e.kind}">${e.kind}</span>` +
          `<span class="top">${esc(e.topic)}</span>` +
          `<span class="pl">${esc(e.payload)}</span>`;
        frag.appendChild(row);
        added++;
      }
      if (added) {
        log.appendChild(frag);
        while (log.childElementCount > FEED_MAX_ROWS) log.removeChild(log.firstChild);
        if (atBottom) log.scrollTop = log.scrollHeight;
      }
      $("feed-count").textContent = `${log.childElementCount} shown`;
    }

    async function feedPoll() {
      if (!$("feed-run").checked) return;
      try {
        const r = await fetch(`${FEED_API}?since=${feedCursor}`, { cache: "no-store" });
        if (!r.ok) return;
        const data = await r.json();
        feedCursor = data.cursor;
        if (data.entries && data.entries.length) appendFeed(data.entries);
      } catch (e) { /* transient; next tick retries */ }
    }

    function feedSchedule() {
      if (feedTimer) clearInterval(feedTimer);
      feedTimer = setInterval(feedPoll, 1500);
    }
    $("feed-clear").onclick = () => { $("feed-log").innerHTML = ""; $("feed-count").textContent = "0 shown"; };
    // Re-filtering clears and replays from the buffer start on next poll.
    $("feed-filter").onchange = () => { $("feed-log").innerHTML = ""; feedCursor = -1; };
    feedPoll();
    feedSchedule();
  </script>
</body>
</html>
